name: Validate website data

on:
  push:
    branches:
      - main
      - refactor/json-data-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate content data
        run: npm run validate:data
      - name: Build static site
        run: npm run build
